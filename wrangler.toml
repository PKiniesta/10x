# Cloudflare Pages Configuration
# This project uses Cloudflare Pages, not Workers
# Deploy using: wrangler pages deploy dist --project-name=10x
# OR use GitHub Actions (recommended)

name = "10x"
compatibility_date = "2026-01-29"
pages_build_output_dir = "dist"

# Note: Environment variables should be set in Cloudflare Dashboard
# Go to: Workers & Pages > Your Project > Settings > Environment variables
# Required variables:
# - SUPABASE_URL
# - SUPABASE_ANON_KEY
# - SUPABASE_SERVICE_ROLE_KEY
# - OPENROUTER_API_KEY
# - OPENROUTER_MODEL
